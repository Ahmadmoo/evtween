data:
  sets:                        # one entry per dataset (README section 4). root: training folder; test_root: held-out test
                               # (only read by run_training.py --final-test); val_root: an official validation folder.
                               # optional per set: weight (sampling share, default 1), fraction, gap or skip, gamma,
                               # min_events, val (official | carve | none), val_frac
    - {name: hqevfi, root: data/hqevfi/train, test_root: data/hqevfi/test}  # EVK4-HD, 142 fps; val carved from train
    - {name: bsergb, root: data/bsergb/train, val_root: data/bsergb/val, test_root: data/bsergb/test}  # Gen4M, 28 fps; official val
    - {name: ced,    root: data/ced/train,    test_root: data/ced/test}     # Color DAVIS346 (346x260); val carved from train
    - {name: eds,    root: data/eds/train,    test_root: data/eds/test}     # Gen3.1 VGA, up to 75 fps; val carved from train
  use: null                    # names of the sets to train on, e.g. [hqevfi, eds] (null: all)
  val_frac: 0.1                # sets without an official validation folder: share of training recordings held out (whole
                               # recordings, chosen by --data-seed; the test split is never touched)
  fraction: 1.0                # share of the eligible training samples used (per set too); deterministic, nested
  select: sample               # sample | sequence: what the fraction picks
  crop: 256                    # multiple of 16, at most the smallest frame side of every set (CED: 260)
  gap: 0.035                   # seconds between I0 and I1; skip per sequence = round(gap * fps) - 1 (142 fps -> 4, 75 -> 2, 28 -> 0).
                               # pick it close to the frame interval of the target video; null -> fixed skip below
  skip: 4                      # frames hidden between I0 and I1 when gap is null
  gamma: null                  # frame gamma for every set (null: gamma.txt of the sequence, else model.gamma); per set too
  context: 4                   # frames per side for the student, taken at the gap's stride (even for vjepa2_1: 2-frame tubelets)
  bins: 16                     # time bins of the teacher's event input
  min_events: 2000             # retry crops with fewer events
  workers: 8

model:
  width: 64
  depth: [2, 2, 4, 2]          # decoder UNet levels
  K: 3                         # polynomial order of the path in time
  z_dim: 32                    # path code per 16x16 patch
  flow_prior: raft             # raft | none
  flow_scale: 16.0             # max size (px) of each learned flow correction term (tanh bound)
  gamma: 1.0                   # PNG -> linear light (HQ-EVFI: 1.0 beat 2.2, val nll 0.35 vs 0.67)
  eps: 0.01                    # L = log(Y + eps)
  c_init: 0.25                 # contrast threshold (learned)
  r_init: 1.0                  # C_off / C_on (learned)
  backbone: vjepa2_1           # vjepa2_1 | levjepa | none (trainable patch embedding, no world knowledge)
  pred_dim: 384                # student transformer width
  pred_depth: 4
  amp: true                    # bf16 on CUDA
  uncertainty: true            # decoder also predicts how unsure the path is about arrival times

loss:
  nll: 1.0                     # exact-time event likelihood
  photo: 1.0                   # hidden real frames
  cmax: 0.0                    # contrast maximization (off: unbounded score lets flows collapse events onto few pixels)
  smooth: 0.01
  sigreg: 0.05                 # keeps the path code Gaussian (LeJEPA SIGReg)
  jepa: 1.0                    # student code vs teacher code
  grid: 128                    # tau steps of the likelihood path (32 sends sub-grid edges / texture into the noise rate)

sensor:                        # generation only (generate.py / physics.Simulator)
  profile: learned             # learned | clean | profile.yaml; generate.py --sensor / --set override it
  set: {}                      # e.g. {pos_thres: 0.3, shot_noise_rate_hz: x0.5}; keys: pos_thres neg_thres sigma_event
                               # sigma_thres shot_noise_rate_hz refractory_period_s (x = relative to the profile)
  min_steps: 4
  max_steps: 256
  seed: 0

train:
  stage: teacher               # probe | teacher | student | joint
  init: null                   # checkpoint to start from (e.g. runs/teacher/checkpoints/best.pt for the student stage)
  out: runs/teacher
  batch: 8                     # per GPU
  lr: 2.0e-4
  wd: 0.05
  steps: 200000
  warmup: 2000
  clip: 1.0
  log_every: 50                # console line + train_metrics.csv row (interval means)
  val_every: 2000              # validation on the validation split, one row per dataset in val_metrics.csv
  save_every: 2000             # checkpoints/last.pt and a step_*.pt snapshot
  keep: 2                      # step_*.pt snapshots kept (last.pt and best.pt always)
  val_batches: 50
  inspect_samples: 32          # samples per dataset for the startup crop statistics
  seed: 0
