data:
  root: data/hqevfi/train      # folder (searched recursively) or list of folders, see README
  val_root: data/hqevfi/test   # optional, same layout
  crop: 256                    # multiple of 16
  skip: 4                      # frames hidden between I0 and I1; pick (skip+1)/fps close to the frame interval of the target video
  context: 4                   # frames per side for the student, taken at the gap's stride (even for vjepa2_1: 2-frame tubelets)
  bins: 16                     # time bins of the teacher's event input
  min_events: 2000             # retry crops with fewer events
  workers: 8

model:
  width: 64
  depth: [2, 2, 4, 2]          # decoder UNet levels
  K: 3                         # polynomial order of the path in time
  z_dim: 32                    # path code per 16x16 patch
  flow_prior: raft             # raft | none
  flow_scale: 16.0             # max size (px) of each learned flow correction term (tanh bound)
  gamma: 1.0                   # PNG -> linear light (HQ-EVFI: 1.0 beat 2.2, val nll 0.35 vs 0.67)
  eps: 0.01                    # L = log(Y + eps)
  c_init: 0.25                 # contrast threshold (learned)
  r_init: 1.0                  # C_off / C_on (learned)
  backbone: vjepa2_1           # vjepa2_1 | levjepa | none (trainable patch embedding, no world knowledge)
  pred_dim: 384                # student transformer width
  pred_depth: 4
  amp: true                    # bf16 on CUDA

loss:
  nll: 1.0                     # exact-time event likelihood
  photo: 1.0                   # hidden real frames
  cmax: 0.0                    # contrast maximization (off: unbounded score lets flows collapse events onto few pixels)
  smooth: 0.01
  sigreg: 0.05                 # keeps the path code Gaussian (LeJEPA SIGReg)
  jepa: 1.0                    # student code vs teacher code
  grid: 128                    # tau steps of the likelihood path (32 sends sub-grid edges / texture into the noise rate)

sensor:                        # generate.py only; thresholds, timing law and noise rate come from the trained model
  noise: 1.0                   # scale on the learned background rate
  mismatch: 0.0                # optional per-pixel threshold spread (not learned)
  refractory: null             # seconds; null = the learned value
  min_steps: 4
  max_steps: 256
  seed: 0

train:
  stage: teacher               # probe | teacher | student | joint
  init: null                   # checkpoint to start from (e.g. runs/teacher/last.pt for the student stage)
  out: runs/teacher
  batch: 8                     # per GPU
  lr: 2.0e-4
  wd: 0.05
  steps: 200000
  warmup: 2000
  clip: 1.0
  log_every: 50
  save_every: 2000
  val_batches: 50
  seed: 0
