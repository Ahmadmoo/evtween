data:
  sets:                        # datasets trained together (converted by <DATASET>/<name>.py); every batch comes from one of them
    hqevfi: {root: data/hqevfi, skip: [0, 4], weight: 1.0, gamma: 1.0}   # 142 fps: 1-5 frame steps = 7-35 ms gaps
    bsergb: {root: data/bsergb, skip: 0, weight: 1.0, gamma: 2.2}   # 20-28 fps: 36-50 ms
    eds:    {root: data/eds,    skip: [0, 2], weight: 1.0, gamma: 1.0}   # 75 fps: 13-40 ms
    ced:    null                                                    # left out; null keeps the ids of the others (checkpoints stay compatible)
                               # root holds train/ and val/ or test/ (val falls back to test); skip = frames hidden
                               # between I0 and I1: (skip+1)/fps close to the frame interval of the target video;
                               # v8.2: [lo, hi] draws one skip per batch from lo..hi (validation at both ends);
                               # weight = share of batches (normalized); the order gives the dataset id (batch["ds"]);
                               # gamma: PNG value^gamma = linear light (check_data.py picks 1.0 or 2.2); each dataset
                               # also gets its own sensor (measured c, r; learned R) and RGB weights
  crop: 256                    # multiple of 16
  context: 4                   # frames per side for the student, taken at the gap's stride (even for vjepa2_1: 2-frame tubelets)
  bins: 32                     # time bins of the teacher's event input (~1.1 ms each)
  min_events: 1500             # retry crops with fewer events (v5's value)
  workers: 8

model:
  width: 64
  depth: [4, 4, 12, 8]         # v7: decoder UNet blocks per level (v5.2: [4, 4, 8, 4]); ~26M parameters
  K: 2                         # v7: flow correction terms per frame (v5.2: 3)
  z_dim: 64                    # path code per patch
  patch: 8                     # one path code per 8x8 px; the student predicts it on this grid too
  enc_depth: 6                 # blocks per level of the teacher's event encoder
  flow_scale: 64.0             # v8: max size (px) of each learned flow term (tanh bound); no RAFT, the flows are all learned
  gamma: 1.0                   # PNG -> linear light for datasets without their own gamma in data.sets
  eps: 0.01                    # L = log(Y + eps)
  c_init: 0.25                 # contrast threshold until measured
  r_init: 1.0                  # C_off / C_on until measured
  backbone: vjepa2_1           # vjepa2_1 | levjepa | none (trainable patch embedding, no world knowledge)
  pred_dim: 512                # student head width
  pred_depth: 8                # v8: conv blocks of the student head (no position code); 20M at 512, 12M at 384
  amp: true                    # bf16 on CUDA
  sigma_event: 0.2             # threshold spread per event (fraction of c), fixed; null = learned (it then soaks up path errors)
  nu: 0.1                      # background events per pixel per second at z = 0; the decoder scales it per pixel and polarity
  tube: measured               # crossings from the least-event path in the frame-noise tube: measured width (v7) | scalar
                               # (x one learned factor per dataset) | false (no tube)
  measure_c: true              # thresholds measured from frame change vs real ON / OFF counts, not learned (c_init until then)
  lora_rank: 0                 # > 0 (e.g. 16): LoRA on the video backbone's attention, trained in the student stage
  lora_blocks: 8               # the last blocks that get LoRA (both ViT-L backbones have 24); the rest stays frozen

loss:
  nll: 1.0                     # exact-time event likelihood (crossings + residual events)
  xt: 2.0                      # x-t / y-t loss: expected vs real ON / OFF events on blurred x-t, y-t slices
  xt_blur: [2, 2]              # its blur (px, ms): compares curves, not single events
  mask: 1.0                    # v8.2: masked slices (v5.3): teacher pass with some event slices hidden, x-t loss on them
  mask_share: 0.25             # share of each batch that gets this pass
  mask_slices: [2, 3]          # hidden slices per sample (of 8), random
  emd: 0.02                    # v8.3: earth mover's distance of the expected events vs the real ones along t, x, y (teacher
                               # and student): pays for how far events are off, not for covering every place (no clouds)
  pmse: 1.0                    # v8.3: PMSE of a sampled stream, expected (teacher and student): random events cost their variance
  sigreg: 0.05                 # keeps the path code Gaussian (LeJEPA SIGReg)
  jepa: 1.0                    # student code vs teacher code
  photo: 10.0                  # interp stage only: the path vs the hidden real frames
  grid: 128                    # tau steps of the likelihood path
  mix: 16                      # how far back (in events) the likelihood looks for a pixel's last crossing

sensor:                        # generation only (generate.py / physics.Simulator)
  profile: learned             # learned | clean | profile.yaml; generate.py --sensor / --set override it
  set: {}                      # e.g. {pos_thres: 0.3, shot_noise_rate_hz: x0.5}; keys: pos_thres neg_thres sigma_event
                               # sigma_thres shot_noise_rate_hz (x = relative to the profile)
  max_steps: 256
  seed: 0
  residual_events: true        # false: crossings only (no residual or background events)

train:
  stage: teacher               # probe | teacher | student | joint | interp
  init: null                   # checkpoint to start from (e.g. runs/teacher/last.pt for the student stage)
  out: runs/teacher
  batch: 8                     # per GPU
  lr: 2.0e-4
  wd: 0.05
  steps: 200000
  warmup: 2000
  clip: 1.0
  lora_lr: 5.0                 # learning rate of the LoRA weights, x train.lr (model.lora_rank > 0)
  log_every: 50
  save_every: 2000
  val_batches: 25              # per dataset
  seed: 0
