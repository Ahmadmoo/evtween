data:
  sets:                        # datasets trained together (converted by <DATASET>/<name>.py); every batch comes from one of them
    hqevfi: {root: data/hqevfi, skip: 4, weight: 1.0, gamma: 1.0}   # 142 fps: 5 frame steps = 35 ms gaps
    bsergb: {root: data/bsergb, skip: 0, weight: 1.0, gamma: 2.2}   # 20-28 fps: 36-50 ms
    eds:    {root: data/eds,    skip: 2, weight: 1.0, gamma: 1.0}   # 75 fps: 40 ms
    ced:    {root: data/ced,    skip: 0, weight: 1.0, gamma: 1.0}   # 9-40 fps: 25-110 ms
                               # root holds train/ and val/ or test/ (val falls back to test); skip = frames hidden
                               # between I0 and I1: (skip+1)/fps close to the frame interval of the target video;
                               # weight = share of batches (normalized); the order gives the dataset id (batch["ds"]);
                               # gamma: PNG value^gamma = linear light (check_data.py picks 1.0 or 2.2); each dataset
                               # also gets its own learned sensor (c, r, k, nu, R) and RGB weights
  crop: 256                    # multiple of 16
  context: 4                   # frames per side for the student, taken at the gap's stride (even for vjepa2_1: 2-frame tubelets)
  bins: 16                     # time bins of the teacher's event input
  min_events: 2000             # retry crops with fewer events
  workers: 8

model:
  vit: s                       # teacher and decoder ViT, from scratch: s (384 wide, 6 heads) | b (768 wide, 12 heads); 12 blocks, 16 px patches
  width: 64                    # decoder output features (DPT head + full-res skip)
  K: 3                         # polynomial order of the path in time
  z_dim: 256                   # path code per 32x32 patch
  ev_dim: 128                  # per-event features before pooling into the patch tokens
  ev_cap: 400000               # max events per batch the teacher tokenizes (random subset above it, training only)
  flow_prior: raft             # raft | none
  flow_scale: 16.0             # max size (px) of each learned flow correction term (tanh bound)
  gamma: 1.0                   # PNG -> linear light for datasets without their own gamma in data.sets
  eps: 0.01                    # L = log(Y + eps)
  c_init: 0.25                 # contrast threshold (learned)
  r_init: 1.0                  # C_off / C_on (learned)
  backbone: vjepa2_1           # vjepa2_1 | levjepa | none (trainable patch embedding, no world knowledge)
  pred_dim: 384                # student transformer width
  pred_depth: 4
  amp: true                    # bf16 on CUDA
  uncertainty: true            # decoder also predicts how unsure the path is about arrival times

loss:
  nll: 1.0                     # exact-time event likelihood
  photo: 1.0                   # hidden real frames
  cmax: 0.0                    # contrast maximization (off: unbounded score lets flows collapse events onto few pixels)
  smooth: 0.01
  sigreg: 0.05                 # keeps the path code Gaussian (LeJEPA SIGReg)
  jepa: 1.0                    # student code vs teacher code
  grid: 128                    # tau steps of the likelihood path (32 sends sub-grid edges / texture into the noise rate)

sensor:                        # generation only (generate.py / physics.Simulator)
  profile: learned             # learned | clean | profile.yaml; generate.py --sensor / --set override it
  set: {}                      # e.g. {pos_thres: 0.3, shot_noise_rate_hz: x0.5}; keys: pos_thres neg_thres sigma_event
                               # sigma_thres shot_noise_rate_hz refractory_period_s (x = relative to the profile)
  min_steps: 4
  max_steps: 256
  seed: 0

train:
  stage: teacher               # probe | teacher | student | joint
  init: null                   # checkpoint to start from (e.g. runs/teacher/last.pt for the student stage)
  out: runs/teacher
  batch: 8                     # per GPU
  lr: 2.0e-4
  wd: 0.05
  steps: 200000
  warmup: 2000
  clip: 1.0
  log_every: 50
  save_every: 2000
  val_batches: 25              # per dataset
  seed: 0
